name: GSP v0 CI
on:
  push:
    branches: [gsp-v0-prototype]
    paths:
      - 'gsp/**'
      - 'tests/test_gsp_protocol.py'
      - '.github/workflows/gsp-v0-ci.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Compile
        run: python -m compileall -q gsp
      - name: GSP tests
        run: python -m pytest -q tests/test_gsp_protocol.py
      - name: Smoke benchmark
        run: |
          python - <<'PY'
          from gsp.protocol import *
          r=Record(Agent.DEVELOPER,Agent.CONTROLLORE,Kind.VERIFY,Level.COMPACT,"PBW-001","abc123","E81")
          b=encode(r)
          assert decode(b)==r
          print("GSP_BYTES",len(b))
          print("GSP_HEX",b.hex())
          PY
